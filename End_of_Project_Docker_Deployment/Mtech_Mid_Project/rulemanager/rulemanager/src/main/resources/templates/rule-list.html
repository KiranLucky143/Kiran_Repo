<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Rules Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow-lg border-0">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h4 class="mb-0"> Rule Management</h4>
            <a href="/rules/new" class="btn btn-light btn-sm">➕ Add Rule</a>
        </div>
        <div class="card-body">
            <table class="table table-bordered table-hover table-striped align-middle">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Rule Name</th>
                    <th>Type</th>
                    <th>Active</th>
                    <th>File</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="rule : ${rules}">
                    <td th:text="${rule.id}"></td>
                    <td th:text="${rule.ruleName}"></td>
                    <td>
                        <span class="badge bg-info" th:text="${rule.ruleType}"></span>
                    </td>
                    <td>
                        <span th:if="${rule.active}" class="badge bg-success">✅ Yes</span>
                        <span th:unless="${rule.active}" class="badge bg-secondary">❌ No</span>
                    </td>
                    <td>
                        <span th:if="${rule.ruleFile != null}">
                            <a th:href="@{'/rules/download/' + ${rule.id}}" class="btn btn-sm btn-outline-primary">⬇ Download</a>
                        </span>
                        <span th:unless="${rule.ruleFile != null}" class="text-muted">—</span>
                    </td>
                    <td>
                        <a th:href="@{/rules/edit/{id}(id=${rule.id})}" class="btn btn-warning btn-sm me-2">✏ Edit</a>
                        <a th:href="@{/rules/delete/{id}(id=${rule.id})}" class="btn btn-danger btn-sm"
                           onclick="return confirm('Are you sure you want to delete this rule?');">🗑 Delete</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
